<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TSS Guard</title>

<link rel="icon" type="image/png" href="icon-192.png">
  
  <meta name="theme-color" content="#315b24">

  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 600px) {

      iframe {
        width: 112%;
        height: 112%;
        transform: scale(0.90);
        transform-origin: top left;
      }

    }

  </style>

</head>
